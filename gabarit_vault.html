<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reels Vault</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --border: #e3e0d8; --text: #1d1c1a;
    --muted: #6d6a63; --accent: #b4462b; --accent-soft: #f6e3dc; --chip: #eeebe4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --border: #2e2d2a; --text: #ecebe7;
      --muted: #9a978f; --accent: #e07a5a; --accent-soft: #3a2620; --chip: #262523;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
           border-bottom: 1px solid var(--border); padding: 14px 16px 10px; }
  .haut { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 10px; display: flex; gap: 10px; align-items: baseline; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .ligne { display: flex; gap: 8px; }
  input[type=search], select { padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
         background: var(--panel); color: var(--text); font-size: 15px; }
  input[type=search] { flex: 1; min-width: 0; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: thin; }
  .chip { flex: none; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border);
          background: var(--panel); color: var(--muted); font-size: 13px; cursor: pointer; white-space: nowrap; }
  .chip.actif { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip b { font-weight: 500; opacity: .7; margin-left: 3px; }
  #sousthemes:empty { display: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 60px; }
  #compte { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  #liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .carte { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
           padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .entete { display: flex; gap: 12px; }
  .entete img { width: 64px; height: 84px; object-fit: cover; border-radius: 8px; flex: none; background: var(--chip); }
  .carte h2 { font-size: 15.5px; margin: 0; line-height: 1.3; }
  .carte h2 a { color: var(--text); text-decoration: none; }
  .carte h2 a:hover { color: var(--accent); }
  .meta { font-size: 12.5px; color: var(--muted); }
  .resume { font-size: 14px; margin: 0; }
  details { font-size: 13.5px; }
  summary { cursor: pointer; color: var(--accent); font-size: 13px; }
  details ul { margin: 6px 0 0; padding-left: 18px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 4px; }
  .tag { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft);
         color: var(--accent); cursor: pointer; border: 0; }
  .pauvre { opacity: .6; }
  #vide { display: none; text-align: center; color: var(--muted); padding: 50px 0; }
  mark { background: var(--accent-soft); color: inherit; border-radius: 3px; }
  @media (max-width: 520px) { #liste { grid-template-columns: 1fr; } select { max-width: 120px; } }
</style>
</head>
<body>
<header><div class="haut">
  <h1>Reels Vault <small>__TOTAL__ vidéos · mis à jour le __DATE__</small></h1>
  <div class="ligne">
    <input id="q" type="search" placeholder="Rechercher : outil, lieu, auteur…" autocomplete="off">
    <select id="format"><option value="">Tous formats</option></select>
  </div>
  <div class="chips" id="domaines"></div>
  <div class="chips" id="sousthemes"></div>
</div></header>
<main>
  <div id="compte"></div>
  <div id="liste"></div>
  <div id="vide">Rien dans le vault là-dessus.</div>
</main>
<script>
const FICHES = __DONNEES__;
const ARBO = __ARBO__;   // [[domaine, [themes...]], ...]

const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = s => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const domaineDe = {};
ARBO.forEach(([d, ts]) => ts.forEach(t => domaineDe[t] = d));
FICHES.forEach(f => {
  f.doms = [...new Set(f.th.map(t => domaineDe[t]))];
  f.cible = norm([f.t, f.r, f.a, f.f, f.i.join(' '), f.k.join(' '), f.th.join(' ')].join(' '));
});

let domaine = null, theme = null;
const $ = id => document.getElementById(id);

function compter(filtre) { return FICHES.filter(filtre).length; }

function chips() {
  $('domaines').innerHTML = ARBO.map(([d]) =>
    `<button class="chip ${d === domaine ? 'actif' : ''}" data-d="${esc(d)}">${esc(d)}<b>${compter(f => f.doms.includes(d))}</b></button>`).join('');
  const themes = domaine ? (ARBO.find(([d]) => d === domaine) || [, []])[1] : [];
  $('sousthemes').innerHTML = themes.map(t =>
    `<button class="chip ${t === theme ? 'actif' : ''}" data-t="${esc(t)}">${esc(t)}<b>${compter(f => f.th.includes(t))}</b></button>`).join('');
}

function surligner(texte, mots) {
  let h = esc(texte);
  mots.forEach(m => {
    if (m.length < 2) return;
    const re = new RegExp('(' + m.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    h = h.replace(re, '<mark>$1</mark>');
  });
  return h;
}

function rendre() {
  const mots = norm($('q').value).split(/\s+/).filter(Boolean);
  const fmt = $('format').value;
  const res = FICHES.filter(f =>
    (!domaine || f.doms.includes(domaine)) && (!theme || f.th.includes(theme)) &&
    (!fmt || f.f === fmt) && mots.every(m => f.cible.includes(m)));
  res.sort((a, b) => (b.x - a.x));
  $('compte').textContent = `${res.length} vidéo${res.length > 1 ? 's' : ''}`;
  $('vide').style.display = res.length ? 'none' : 'block';
  const brut = $('q').value.trim().split(/\s+/).filter(Boolean);
  $('liste').innerHTML = res.map(f => `
    <article class="carte ${f.x ? '' : 'pauvre'}">
      <div class="entete">
        ${f.img ? `<img loading="lazy" src="${esc(f.img)}" alt="" onerror="this.remove()">` : ''}
        <div>
          <h2><a href="${esc(f.l)}" target="_blank" rel="noopener">${surligner(f.t, brut)}</a></h2>
          <div class="meta">${esc(f.a)} · ${esc(f.f)}</div>
        </div>
      </div>
      <p class="resume">${surligner(f.r, brut)}</p>
      ${f.i.length ? `<details><summary>À retenir (${f.i.length})</summary><ul>${f.i.map(i => `<li>${surligner(i, brut)}</li>`).join('')}</ul></details>` : ''}
      <div class="tags">${f.th.map(t => `<button class="tag" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    </article>`).join('');
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-d],[data-t]');
  if (!b) return;
  if (b.dataset.d !== undefined) {
    domaine = domaine === b.dataset.d ? null : b.dataset.d; theme = null;
  } else {
    const t = b.dataset.t;
    if (theme === t) { theme = null; } else { theme = t; domaine = domaineDe[t]; }
  }
  chips(); rendre();
  if (b.classList.contains('tag')) window.scrollTo({top: 0, behavior: 'smooth'});
});
[...new Set(FICHES.map(f => f.f))].sort().forEach(f => $('format').insertAdjacentHTML('beforeend', `<option>${esc(f)}</option>`));
$('q').addEventListener('input', rendre);
$('format').addEventListener('change', rendre);
chips(); rendre();
</script>
</body>
</html>
